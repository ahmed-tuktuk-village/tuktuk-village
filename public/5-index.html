<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5b700"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>توك توك</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:#fff8e1;color:#222;min-height:100vh}
header{background:#f5b700;padding:14px 16px;font-weight:700;font-size:20px;display:flex;justify-content:space-between;align-items:center}
main{padding:16px;max-width:480px;margin:auto}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px #0002}
label{display:block;margin:10px 0 4px;font-weight:600}
input,select{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;font-size:17px}
button{width:100%;padding:14px;border:0;border-radius:12px;font-size:18px;font-weight:700;background:#222;color:#fff;margin-top:12px}
button.alt{background:#eee;color:#222}button.go{background:#1a9b3c}button.bad{background:#c62828}
button:disabled{opacity:.5}
.seg{display:flex;gap:8px}.seg button{margin:0;background:#eee;color:#222}.seg button.on{background:#222;color:#fff}
.price{font-size:26px;font-weight:800}.muted{color:#666;font-size:14px}.err{color:#c62828;font-weight:600;margin-top:8px}
.badge{display:inline-block;padding:4px 10px;border-radius:99px;background:#ffe082;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
a.call{display:block;text-align:center;padding:12px;background:#e8f5e9;border-radius:10px;color:#1b5e20;font-weight:700;text-decoration:none;margin-top:8px}
</style></head><body>
<header><span>🛺 توك توك <span id="vname"></span></span><span id="who" class="muted"></span></header>
<main id="app"></main>
<script src="app.js"></script>
</body></html>
